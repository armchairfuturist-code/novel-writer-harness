name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        continue-on-error: true
        run: ruff check .
      - name: Run tests
        run: python -m pytest tests/ -v

  test-no-numpy:
    name: test without optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package only
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  prose-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Gate reference chapters on the deterministic prose instrument
        run: python -m pipeline.prose_lab reference/chapters/*.md
