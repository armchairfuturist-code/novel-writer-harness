[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storyforge"
version = "0.1.0"
description = "Autonomous novel-writing pipeline with multi-model AI routing (Kimi K2.6, DeepSeek, Gemini). Markdown/PDF/epub export."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/armchairfuturist-code/novel-writer-harness"

[project.optional-dependencies]
dev = [
    "pytest",
]
embeddings = [
    "sentence-transformers>=2.2",
    "torch>=1.13",
]

[project.scripts]
storyforge = "storyforge:main"